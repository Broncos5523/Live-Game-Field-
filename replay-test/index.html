<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Man Cave — Isolated ESPN Replay Test</title><style>*{box-sizing:border-box}body{margin:0;background:#020811;color:#fff;font:14px Arial}header{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#0c2033}button,select{background:#173b58;color:white;border:1px solid #7294ac;border-radius:6px;padding:9px}button{cursor:pointer}#status{color:#c7deed}#screen{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000}iframe{border:0;width:1280px;height:720px;position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}small{color:#b4c8d9}#detail{padding:8px 12px}</style></head><body><header><strong>REPLAY TEST — NOT LIVE</strong><select id="sport"><option>NBA</option><option>NHL</option><option>NFL</option><option>WNBA</option><option>MLB</option><option value="CFB">College Football</option><option value="CBB">College Basketball</option></select><button id="load">Load completed game</button><button id="play" disabled>Play</button><button id="pause" disabled>Pause</button><span id="status">Choose a league and load a game.</span></header><div id="screen"><iframe id="board" title="Approved live game board" src="../rotation-preview/live.html"></iframe></div><div id="detail"><small>Isolated ESPN historical replay. No changes to the production Game Center. A completed game's play events are stepped through; data freshness and actual live delivery must still be verified during a live game.</small></div><script src="../rotation/approved-policy.js"></script><script>
'use strict';
const routes={NFL:'football/nfl',NBA:'basketball/nba',NHL:'hockey/nhl',MLB:'baseball/mlb',WNBA:'basketball/wnba',CFB:'football/college-football',CBB:'basketball/mens-college-basketball'};
const el=id=>document.getElementById(id),status=msg=>el('status').textContent=msg;
let summary=null,event=null,plays=[],index=0,timer=null,ready=false;
function resize(){el('board').style.transform='scale('+el('screen').clientWidth/1280+')'}addEventListener('resize',resize);resize();
el('board').addEventListener('load',()=>{ready=true});
async function get(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('ESPN HTTP '+response.status);return response.json()}
function ymd(t){return new Date(t).toISOString().slice(0,10).replace(/-/g,'')}
function pickPlays(s){return Array.isArray(s.plays)?s.plays:Array.isArray(s.drives?.previous)?s.drives.previous.flatMap(d=>d.plays||[]):[]}
function replaySituation(p,prior,drives){const source=drives?.previous?.find(d=>(d.plays||[]).some(x=>String(x.id)===String(p.id)))||drives?.current;const team=p.team?.id||source?.team?.id||prior?.possession||null;const down=p.start?.down??p.end?.down??null;const distance=p.start?.distance??p.end?.distance??null;const yard=p.start?.yardLine??p.end?.yardLine??null;const shortDownDistanceText=down&&distance!=null?down+['','st','nd','rd','th'][Math.min(4,down)]+' & '+distance:null;const spot=p.start?.text||p.end?.text||null;return {...(prior||{}),possession:team||prior?.possession,down:down??prior?.down,distance:distance??prior?.distance,yardLine:yard??prior?.yardLine,shortDownDistanceText:shortDownDistanceText||prior?.shortDownDistanceText,downDistanceText:shortDownDistanceText||prior?.downDistanceText,possessionText:spot||prior?.possessionText,lastPlay:{...p,drive:source?{description:source.description||source.displayResult||'IN PROGRESS',start:source.start||{text:source.start?.text||'DRIVE START'}}:undefined}}}
function replayTimeouts(competitors,p,history,sport){if(!['NBA','WNBA','CBB','NFL','CFB'].includes(sport))return competitors;const count=sport==='NFL'?3:sport==='CFB'?3:sport==='CBB'?4:7;return competitors.map(c=>{const id=String(c.team?.id||c.id||'');const explicit=p.timeouts?.[c.homeAway]??p.timeoutsRemaining?.[c.homeAway];if(Number.isFinite(Number(explicit))&&explicit!=null)return {...c,timeoutsRemaining:Number(explicit)};const used=history.filter(x=>/timeout/i.test(String(x.type?.text||x.type?.detail||''))&&String(x.team?.id||'')===id).length;return {...c,timeoutsRemaining:Math.max(0,count-used)};})}
function updateCompetitors(c,p){return c.map(x=>{const side=x.homeAway;const score=side==='home'?p.homeScore:p.awayScore;return {...x,score:Number.isFinite(Number(score))?String(score):x.score}})}
async function step(){if(!summary||!ready||!plays.length)return;const p=plays[Math.min(index,plays.length-1)];const header=structuredClone(summary.header);const base=header.competitions?.[0];if(base){base.competitors=replayTimeouts(updateCompetitors(base.competitors||[],p),p,plays.slice(0,index+1),el('sport').value);if(['NFL','CFB'].includes(el('sport').value))base.situation=replaySituation(p,base.situation,summary.drives);base.status={...(base.status||{}),type:{...(base.status?.type||{}),name:'STATUS_IN_PROGRESS',state:'in',completed:false,description:'Replay'},displayClock:p.clock?.displayValue||base.status?.displayClock,period:p.period?.number||p.period||base.status?.period};}const synthetic={...summary,header,plays:plays.slice(0,index+1),drives:summary.drives?{...summary.drives,current:summary.drives.previous?.find(d=>(d.plays||[]).some(x=>String(x.id)===String(p.id)))||summary.drives.current}:undefined};const selected={...event,competitions:[base||event.competitions?.[0]],status:base?.status||event.status};try{await el('board').contentWindow.receiveApproved({sport:el('sport').value,event:selected,summary:synthetic,events:[selected],ranks:{},recent:true,liveCount:1,totalFinals:0,tickerStartedAt:Date.now()});status('Historical play '+(index+1)+' / '+plays.length+' — '+(p.text||p.type?.text||'Event'));}catch(err){stop();status('Display error: '+err.message)}index=Math.min(index+1,plays.length-1);if(index===plays.length-1)stop()}
function stop(){clearInterval(timer);timer=null}
el('load').onclick=async()=>{stop();el('play').disabled=true;el('pause').disabled=true;ready=!!el('board').contentWindow?.receiveApproved;const sport=el('sport').value,base='https://site.api.espn.com/apis/site/v2/sports/'+routes[sport];status('Finding a completed '+sport+' game…');try{let found=null;for(let offset=0;offset<30&&!found;offset+=3){const d=ymd(Date.now()-offset*86400000),data=await get(base+'/scoreboard?dates='+d+'&limit=100');found=(data.events||[]).find(x=>x.status?.type?.completed||x.status?.type?.state==='post')}if(!found)throw Error('No completed game found in last 30 days');event=found;summary=await get(base+'/summary?event='+found.id);plays=pickPlays(summary);if(!plays.length)throw Error('ESPN summary has no replayable play list for this game');index=0;el('play').disabled=false;el('pause').disabled=false;status('Loaded '+plays.length+' actual ESPN plays. Press Play.');await step()}catch(err){status('Unable to load replay: '+err.message)}};
el('play').onclick=()=>{if(!plays.length)return;stop();timer=setInterval(step,5000);status('Replaying historical ESPN plays…')};
el('pause').onclick=()=>{stop();status('Replay paused at '+index+' / '+plays.length)};
</script></body></html>
