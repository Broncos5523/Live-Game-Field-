<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Arena — 3D Renderer Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d15;color:#f4f6fa;font-family:Arial,sans-serif}main{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 5%,#20354c,#070d15 72%);padding:1vh 1vw;gap:.7vh}.head{height:6%;display:flex;align-items:center;justify-content:space-between;font-weight:900;letter-spacing:.12em;font-size:clamp(10px,1.2vw,21px)}.gold{color:#f1ca6a}.viewport{flex:1;min-height:0;position:relative;border:2px solid #b18b43;border-radius:7px;overflow:hidden;box-shadow:0 0 25px #b88a3930}.viewport canvas{display:block;width:100%;height:100%}.tag{position:absolute;top:1.5%;left:1%;background:#091524e6;border:1px solid #a38a52;padding:.55vh .8vw;font-size:clamp(9px,.9vw,16px);font-weight:800}.buttons{position:absolute;right:1%;bottom:2%;display:flex;gap:.5vw}.buttons button{border:1px solid #e3bd61;background:#0a192ad9;color:#f3d17d;font-weight:bold;padding:.6vh 1vw;border-radius:4px;font-size:clamp(10px,1vw,18px)}.score{height:20%;min-height:70px;display:grid;grid-template-columns:22% 22% 17% 39%;background:#142235;border:1px solid #a38a52;border-radius:5px;overflow:hidden}.team{display:flex;align-items:center;justify-content:space-around;font-size:clamp(16px,2vw,32px);font-weight:900;background:linear-gradient(120deg,var(--c),#152236)}.team strong{font-size:clamp(24px,3.5vw,62px)}.clock{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:clamp(12px,1.6vw,26px)}.clock small{color:#e6c369;font-size:.65em;margin-top:.6vh}.card{border-left:2px solid #b18b43;display:flex;align-items:center;gap:1vw;padding:.7vh 1vw;background:linear-gradient(120deg,#172c42,#0b1523)}.avatar{height:85%;aspect-ratio:4/5;border:2px solid #d5b466;background:#315c7e;display:grid;place-items:center;font-size:clamp(17px,2.8vw,48px);font-weight:900}.card small{color:#e5c064;font-size:clamp(9px,.8vw,14px);font-weight:900}.card h2{font-size:clamp(13px,1.7vw,28px);margin:.4vh 0}.card p{font-size:clamp(10px,1.1vw,19px);margin:0}.notice{position:absolute;bottom:2%;left:1%;background:#091524d9;padding:.4vh .6vw;font-size:clamp(8px,.85vw,14px)}@media(max-width:600px){.head{font-size:9px}.score{height:24%}.card h2{font-size:12px}.card p{font-size:9px}}</style></head><body><main><header class="head"><span>MAN CAVE SPORTS BOOK <span class="gold">/ 3D ARENA ENGINE LAB</span></span><span id="engine">INITIALIZING</span></header><section class="viewport" id="viewport"><div class="tag">DENVER vs KANSAS CITY • 3D FIELD DETAIL V2</div><div class="notice">ILLUSTRATIVE ATHLETES • DEMO ONLY • NOT LIVE DATA</div><div class="buttons"><button id="play">TEST PLAY</button><button id="lights">LIGHTING</button></div></section><footer class="score"><div class="team" style="--c:#d95813">DEN <strong>24</strong></div><div class="team" style="--c:#a71930">KC <strong>20</strong></div><div class="clock">Q4 02:18<small>1ST &amp; 10</small></div><div class="card"><div class="avatar" id="avatar">BN</div><div><small>GAME LEADER • QB</small><h2 id="leader">BO NIX</h2><p id="stats">248 PASS YDS • 2 TD</p></div></div></footer></main>
<script type="module">
const viewport=document.getElementById("viewport"),engine=document.getElementById("engine");let THREE;try{THREE=await import("https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js")}catch(e){engine.textContent="3D UNAVAILABLE";const el=document.createElement("div");el.style.cssText="position:absolute;inset:25%;text-align:center;color:#f2cf77";el.textContent="This browser could not load the 3D engine. The main arena preview remains available.";viewport.append(el);throw e}
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"low-power",alpha:false})}catch(e){engine.textContent="WEBGL UNAVAILABLE";throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));renderer.setClearColor(0x111b2b);viewport.prepend(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x111b2b);const camera=new THREE.OrthographicCamera(-63,63,38,-38,.1,500);camera.position.set(0,120,0.01);camera.lookAt(0,0,0);const ambient=new THREE.AmbientLight(0xffffff,1.6);scene.add(ambient);const sun=new THREE.DirectionalLight(0xffe1a2,2.0);sun.position.set(-30,75,30);scene.add(sun);
function mat(c){return new THREE.MeshLambertMaterial({color:c})}function box(w,h,d,c,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));mesh.position.set(x,y,z);scene.add(mesh);return mesh}function plane(w,d,c,x,y,z){return box(w,.12,d,c,x,y,z)}const field=plane(110,54,0x286f42,0,0,0);for(let i=-5;i<=5;i++){plane(.23,53,0xffffff,i*9.1,.12,0);if(i!==0)for(const z of [-20,20])plane(1.8,.28,0xffffff,i*9.1,.15,z)}for(const x of [-50,50])plane(10,53,x<0?0xed6a19:0xa71930,x,.15,0);
for(const z of [-29,29]){plane(118,3,0x64758a,0,-.3,z);for(let j=-2;j<=2;j++)plane(118,1.5,j%2?0x304559:0x41576c,0,-.25,z+(z<0?-1:1)*(3+Math.abs(j)*1.8))}
for(const x of [-59,59]){plane(4,75,0x263b4e,x,-.4,0);for(let j=0;j<3;j++)plane(1.2,75,0x415469,x+(x<0?-1:1)*(j+1),-.2,0)}
// Benches and sidelines are geometry, not image assets.
for(const z of [-34,34]){for(let i=-5;i<=5;i++){box(4,.9,1.4,0x202a38,i*8,-.2,z);box(2,1.6,.8,i%2?0x9d2532:0xdf641e,i*8,1,z+(z>0?1.2:-1.2))}}
const crowdColors=[0xb9c6d2,0xd06426,0x9c2c39,0x6b8094,0xd5ba7b];const crowdGeo=new THREE.BoxGeometry(.9,.85,.9);const crowdMats=crowdColors.map(mat);const crowds=new THREE.InstancedMesh(crowdGeo,crowdMats[0],800);const dummy=new THREE.Object3D();let n=0;for(let i=0;i<800;i++){const a=(i*0.61803398875)%1,b=(i*.7548776662)%1;const x=(a-.5)*124,z=(b-.5)*76;if(Math.abs(x)<56&&Math.abs(z)<29)continue;dummy.position.set(x,.4,z);dummy.updateMatrix();crowds.setMatrixAt(n++,dummy.matrix)}crowds.count=n;scene.add(crowds);const sidelineMark=mat(0xe9e3c8);for(const z of [-27,27])for(let i=-9;i<=9;i++){const mark=new THREE.Mesh(new THREE.BoxGeometry(1.4,.12,.28),sidelineMark);mark.position.set(i*5.5,.24,z);scene.add(mark)}
function athlete(color,num,x,z){const group=new THREE.Group();const jersey=mat(color),skin=mat(0xcaa780),dark=mat(0x20252b);const torso=new THREE.Mesh(new THREE.BoxGeometry(2.25,2.2,1.45),jersey);torso.position.y=2.4;group.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.68,9,7),skin);head.position.y=4.05;group.add(head);const helmet=new THREE.Mesh(new THREE.SphereGeometry(.83,10,7,0,Math.PI*2,0,Math.PI*.68),jersey);helmet.position.y=4.28;group.add(helmet);const facemask=new THREE.Mesh(new THREE.BoxGeometry(1.35,.13,.16),mat(0xd7dce2));facemask.position.set(0,3.87,-.7);group.add(facemask);const shoulders=new THREE.Mesh(new THREE.BoxGeometry(3.0,.55,1.75),jersey);shoulders.position.y=3.22;group.add(shoulders);const backNumber=new THREE.Mesh(new THREE.PlaneGeometry(.85,1.1),mat(0xffffff));backNumber.rotation.x=-Math.PI/2;backNumber.position.set(0,3.52,0);group.add(backNumber);for(const sx of [-1,1]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.3,.36,1.4,5),dark);leg.position.set(sx*.45,.85,0);group.add(leg);const arm=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,1.5,5),jersey);arm.position.set(sx*1.25,2.4,0);arm.rotation.z=sx*.25;group.add(arm)}group.position.set(x,0,z);scene.add(group);return group}
const players=[];for(let i=0;i<11;i++){const z=-20+(i%6)*8;const ax=-15+(i%3)*2.8,bx=5+(i%3)*2.8;players.push({mesh:athlete(0xf2671e,i,ax,z),side:-1,baseX:ax});players.push({mesh:athlete(0xa71930,i,bx,z),side:1,baseX:bx})}
let active=false,playStart=0,night=false;document.getElementById("play").onclick=()=>{active=true;playStart=performance.now()};document.getElementById("lights").onclick=()=>{night=!night;ambient.intensity=night?.7:1.6;sun.intensity=night?3:2;scene.background=new THREE.Color(night?0x030915:0x111b2b)};let leader=0;setInterval(()=>{leader=1-leader;document.getElementById("leader").textContent=leader?"PATRICK MAHOMES":"BO NIX";document.getElementById("avatar").textContent=leader?"PM":"BN";document.getElementById("avatar").style.background=leader?"#862536":"#315c7e";document.getElementById("stats").textContent=leader?"231 PASS YDS • 2 TD":"248 PASS YDS • 2 TD"},7000);
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);const aspect=w/h;const halfHeight=Math.max(31,68/aspect);camera.left=-halfHeight*aspect;camera.right=halfHeight*aspect;camera.top=halfHeight;camera.bottom=-halfHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(viewport);resize();engine.textContent="WEBGL 3D • DEMO";
function frame(now){if(active){const t=Math.min((now-playStart)/2600,1);for(const p of players){p.mesh.position.x=p.baseX+(p.side<0?1:-.4)*Math.sin(t*Math.PI*.5)*9;p.mesh.rotation.y=Math.sin(t*6)*.16}if(t>=1)active=false}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
