const leagues={NBA:['basketball','nba'],WNBA:['basketball','wnba'],NFL:['football','nfl'],CFB:['football','college-football'],NHL:['hockey','nhl'],MLB:['baseball','mlb'],CBB:['basketball','mens-college-basketball']};const params=new URLSearchParams(location.search);const sport=(params.get('sport')||'NBA').toUpperCase();const cfg=leagues[sport]||leagues.NBA;document.getElementById('leagueText').textContent=sport;document.getElementById('leagueLogo').src='../landscape-preview-v1/assets/league-logos/'+sport+'.png';document.getElementById('leagueLogo').onerror=function(){this.hidden=true};function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720))}addEventListener('resize',fit);fit();const el=id=>document.getElementById(id);const api='https://site.api.espn.com/apis/site/v2/sports/'+cfg.join('/');async function json(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function team(event,side){return event.competitions?.[0]?.competitors?.find(c=>c.homeAway===side)}function setImg(id,src){const x=el(id);if(src){x.src=src;x.hidden=false}else{x.hidden=true}}function showGame(event){const venueTeam=team(event,'home');const venueCode=(venueTeam?.team?.abbreviation||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(venueCode){const image=new Image();const path='../landscape-preview-v1/assets/venues/'+sport+'/'+venueCode+'.webp';image.onload=()=>el('stage').style.setProperty('--venue-image','url("'+path+'")');image.onerror=()=>el('stage').style.removeProperty('--venue-image');image.src=path;}const a=team(event,'away'),h=team(event,'home');if(!a||!h)return;const cleanColor=v=>{if(!/^#?[0-9a-f]{6}$/i.test(v||''))return '#607f9e';const hex=v.replace('#','');const rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));return '#'+rgb.map(c=>Math.round(c*.65+255*.35).toString(16).padStart(2,'0')).join('')};const palette={NO:['#0C2340','#B4975A'],LAC:['#1D428A','#C8102E'],BOS:['#007A33','#BA9653'],LAL:['#552583','#FDB927'],NYK:['#006BB6','#F58426'],GS:['#1D428A','#FFC72C'],CHI:['#CE1141','#000000'],MIA:['#98002E','#F9A01B'],DAL:['#00538C','#B8C4CA'],DEN:['#0E2240','#FEC524'],PHX:['#1D1160','#E56020'],MIL:['#00471B','#EEE1C6'],PHI:['#006BB6','#ED174C'],SAC:['#5A2D81','#63727A'],CLE:['#6F263D','#FFB81C'],ATL:['#E03A3E','#C1D32F'],BKN:['#000000','#FFFFFF'],ORL:['#0077C0','#C4CED4'],IND:['#002D62','#FDBB30'],MIN:['#0C2340','#78BE20'],UTA:['#27251F','#F9A01B'],POR:['#E03A3E','#000000'],TOR:['#CE1141','#A1A1A4'],WAS:['#002B5C','#E31837'],CHA:['#1D1160','#00788C'],DET:['#C8102E','#006BB6'],MEM:['#5D76A9','#12173F'],OKC:['#007AC1','#EF3B24'],SA:['#C4CED4','#000000'],HOU:['#CE1141','#000000']};const rgb=v=>[1,3,5].map(i=>parseInt(v.slice(i,i+2),16));const distance=(x,y)=>{const p=rgb(x),q=rgb(y);return Math.sqrt(p.reduce((t,v,i)=>t+(v-q[i])**2,0))};const awayCode=a.team?.abbreviation||'',homeCode=h.team?.abbreviation||'';const homeHex=cleanColor(h.team?.color);let awayHex=cleanColor(a.team?.color);if(distance(awayHex,homeHex)<115){const secondary=a.team?.alternateColor&&/^#?[0-9a-f]{6}$/i.test(a.team.alternateColor)?'#'+a.team.alternateColor.replace('#',''):palette[awayCode]?.[1];if(secondary)awayHex=secondary} el('stage').style.setProperty('--away-color',awayHex);el('stage').style.setProperty('--home-color',homeHex);el('stage').style.setProperty('--pill-gradient','linear-gradient(90deg,'+awayHex+' 0%,'+awayHex+' 44%,#14243b 49%,#14243b 51%,'+homeHex+' 56%,'+homeHex+' 100%)');el('stage').style.setProperty('--winner-color',cleanColor(Number(a.score)>Number(h.score)?a.team?.color:h.team?.color));el('stage').dataset.winner=Number(a.score)>Number(h.score)?'away':'home';for(const [key,t] of [['away',a],['home',h]]){el(key+'Name').textContent=t.team?.shortDisplayName||t.team?.displayName||key;el(key+'Score').textContent=t.score??'—';el(key+'Abbr').textContent=t.team?.abbreviation||key;const logo=t.team?.logo||t.team?.logos?.[0]?.href;setImg(key+'Logo',logo);setImg(key+'CenterLogo',logo)}el('status').textContent='FINAL';el('date').textContent=new Date(event.date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});loadSummary(event.id)}function renderStats(a,h){const sa=a?.statistics||[],sh=h?.statistics||[];const map=new Map(sh.map(x=>[x.name||x.label,x]));const rows=sa.filter(x=>map.has(x.name||x.label)).slice(0,4);el('stats').innerHTML='';if(!rows.length){el('stats').textContent='Team comparison unavailable for this game';return}for(const x of rows){const y=map.get(x.name||x.label),row=document.createElement('div');row.className='statrow';for(const v of [x.displayValue??x.value??'—',x.label||x.name,y.displayValue??y.value??'—']){const n=document.createElement(v===x.label||v===x.name?'span':'strong');n.textContent=String(v);if(n.tagName==='SPAN'){n.style.backgroundImage=el('stage').style.getPropertyValue('--pill-gradient');n.style.backgroundColor='#233a55'}row.appendChild(n)}el('stats').appendChild(row);const av=parseFloat(x.displayValue??x.value),hv=parseFloat(y.displayValue??y.value);if(Number.isFinite(av)&&Number.isFinite(hv)&&av>=0&&hv>=0){const bars=document.createElement('div');bars.className='comparison-bars';const left=document.createElement('span'),right=document.createElement('span');left.style.width=(av/(Math.max(av,hv)||1)*100)+'%';right.style.width=(hv/(Math.max(av,hv)||1)*100)+'%';bars.append(left,right);row.style.setProperty('--away-share',(av/(av+hv||1)*100)+'%');el('stats').appendChild(bars)}}}function showPerformer(side,summary){const teams=summary.boxscore?.players||[];const entry=teams.find(x=>x.team?.id===team(summary.header||{},side)?.team?.id);const competitor=summary.header?.competitions?.[0]?.competitors?.find(x=>x.homeAway===side);const box=teams.find(x=>x.team?.id===competitor?.team?.id);const players=(box?.statistics||[]).flatMap(x=>x.athletes||[]).filter(x=>x.athlete);const p=players.find(x=>x.starter)||players[0];el(side+'Player').textContent=p?.athlete?.displayName||'Player data unavailable';el(side+'PlayerStats').textContent=p?.stats?.slice(0,3).join(' • ')||'—';setImg(side+'PlayerImg',p?.athlete?.headshot?.href)}async function loadSummary(id){el('stats').textContent='Loading team comparison…';for(const side of ['away','home']){el(side+'Player').textContent='Loading performer…';el(side+'PlayerStats').textContent='—';setImg(side+'PlayerImg',null)}try{const s=await json(api+'/summary?event='+encodeURIComponent(id));const c=s.boxscore?.teams||[];renderStats(c.find(x=>x.homeAway==='away'),c.find(x=>x.homeAway==='home'));showPerformer('away',s);showPerformer('home',s)}catch(e){el('stats').textContent='Verified statistics unavailable';for(const side of ['away','home'])el(side+'Player').textContent='Player data unavailable'}}async function update(){try{const now=Date.now(),days=[0,1,2,3,4,5,6,7].map(d=>{const date=new Date(now-d*86400000);return date.getFullYear()+String(date.getMonth()+1).padStart(2,'0')+String(date.getDate()).padStart(2,'0')});const results=await Promise.all(days.map(d=>json(api+'/scoreboard?dates='+d+'&limit=200').catch(()=>({events:[]}))));const seen=new Map();results.flatMap(x=>x.events||[]).filter(e=>e.status?.type?.state==='post').forEach(e=>seen.set(e.id,e));const all=[...seen.values()].sort((a,b)=>new Date(b.date)-new Date(a.date));const recent=all.filter(e=>now-new Date(e.date).getTime()<=86400000);const chosen=recent.length?recent:all;if(!chosen.length){el('finalCount').textContent='0 GAMES';el('ticker-content').textContent='No completed '+sport+' games available';el('stats').textContent='No completed games available';return}el('ticker-label').textContent=recent.length?'LAST 24H':'RECENT GAMES';el('finalCount').textContent=chosen.length+' '+(chosen.length===1?'GAME':'GAMES')+(recent.length?' · 24H':' · RECENT');const track=el('ticker-content');track.replaceChildren();function buildFinal(e){const a=team(e,'away'),h=team(e,'home');const item=document.createElement('span');item.className='ticker-final-item';function addTeam(t){const wrap=document.createElement('span');wrap.className='ticker-final-team';const logo=t?.team?.logo||t?.team?.logos?.[0]?.href;if(logo){const img=document.createElement('img');img.src=logo;img.alt=(t?.team?.abbreviation||'Team')+' logo';img.loading='eager';wrap.appendChild(img)}const name=document.createElement('b');name.textContent=t?.team?.abbreviation||'—';wrap.appendChild(name);const score=document.createElement('strong');score.textContent=t?.score??'—';wrap.appendChild(score);item.appendChild(wrap)}addTeam(a);const dash=document.createElement('span');dash.textContent='–';dash.className='ticker-final-dash';item.appendChild(dash);addTeam(h);const status=document.createElement('small');status.textContent=recent.length?'':new Date(e.date).toLocaleDateString();item.appendChild(status);return item}for(let repeat=0;repeat<2;repeat++){for(const e of chosen)track.appendChild(buildFinal(e))}track.animate([{transform:'translateX(0)'},{transform:'translateX(-50%)'}],{duration:Math.max(25000,chosen.length*5000),iterations:Infinity});const wanted=params.get('event');showGame(chosen.find(e=>e.id===wanted)||chosen[0])}catch(e){el('ticker-content').textContent='Unable to load verified '+sport+' finals';el('stats').textContent='Game data temporarily unavailable'}}update();setInterval(update,120000);
</script></body></html>
