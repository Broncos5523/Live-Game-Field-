<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Man Cave Sports Book — Final Game Review</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020a14;color:#f2f6ff;font-family:Arial,sans-serif;overflow:hidden}#stage{position:absolute;width:1280px;height:720px;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:linear-gradient(120deg,#061523d9,#09182cc9),url('../landscape-preview-v1/assets/branding/man-cave-sports-book-transparent.png') center/contain no-repeat;display:grid;grid-template-rows:75px 132px 1fr 67px;gap:9px;padding:12px 22px}.glass{background:#10243bc7;border:1px solid #5c76914d;border-radius:13px;backdrop-filter:blur(9px)}header{display:flex;align-items:center;justify-content:space-between}header img{height:69px;max-width:300px;object-fit:contain}header .title{font-size:21px;font-weight:900;letter-spacing:3px}#league{font-size:22px;font-weight:900;color:#b5d4ee}#score{display:grid;grid-template-columns:1fr 220px 1fr;align-items:center;padding:12px 25px}.team{display:flex;align-items:center;gap:20px;font-weight:800;font-size:24px}.team.home{justify-content:flex-end}.team img{width:74px;height:74px;object-fit:contain}.team strong{font-size:58px}.middle{text-align:center}.middle b{display:block;font-size:28px;color:#f4d185}.middle small{display:block;margin-top:6px;color:#a9c1d4;font-size:16px}#body{display:grid;grid-template-columns:19% 1fr 19%;gap:10px;min-height:0}.panel{padding:18px;min-height:0;overflow:hidden}.panel h2{margin:0 0 20px;color:#efc976;font-size:18px;letter-spacing:1px;text-align:center}.performer{text-align:center}.performer img{height:160px;max-width:100%;object-fit:contain}.performer h3{font-size:24px;margin:12px 0}.performer p{font-size:19px;color:#cbdceb}.statrow{display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #53657a40;text-align:center;font-size:23px}.statrow span{font-size:16px;color:#b2c9db}.logos{display:flex;justify-content:space-around;align-items:center;margin:6px 0 16px}.logos img{width:90px;height:90px;object-fit:contain}.logos b{font-size:14px;color:#b7cde0}#ticker{display:flex;align-items:center;gap:22px;padding:10px 20px;overflow:hidden}#ticker-label{color:#f3d080;white-space:nowrap;font-size:19px;font-weight:900}#ticker-track{white-space:nowrap;overflow:hidden;font-size:20px}#ticker-content{display:inline-block;animation:marquee 28s linear infinite}@keyframes marquee{to{transform:translateX(-50%)}}.muted{color:#9bb1c4}.notice{font-size:17px;color:#b4c9d9;text-align:center;margin-top:55px}</style><style id="live-board-visual-alignment">

</style><style id="final-ticker-team-logos">#ticker-content{display:inline-flex;align-items:center;gap:28px;animation-duration:45s}.ticker-final-item{display:inline-flex;align-items:center;gap:11px;padding-right:20px;border-right:1px solid #ffffff40}.ticker-final-team{display:inline-flex;align-items:center;gap:6px}.ticker-final-team img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 1px 3px #0008)}.ticker-final-team b{font-size:17px}.ticker-final-team strong{font-size:19px}.ticker-final-dash{color:#a5b6c8}.ticker-final-item small{font-size:13px;color:#b8cbdc}#ticker-track{flex:1;min-width:0}</style><style id="league-logo-ticker-fix">#league{display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 12px;background:transparent;border:0}#leagueLogo{height:47px;width:57px;object-fit:contain}#leagueText{display:none}#leagueLogo[hidden]+#leagueText{display:inline}#ticker-content{animation:none!important;transform:none!important;gap:20px;min-width:max-content}#ticker-track{overflow:hidden}#ticker-content .ticker-final-team img{display:inline-block!important;width:28px;height:28px;min-width:28px;vertical-align:middle}#ticker-content .ticker-final-item{flex-shrink:0}</style><style id="scoreboard-final-count">header{position:relative;justify-content:space-between}header>img{position:absolute;left:50%;transform:translateX(-50%);height:60px;max-width:270px}#finalCount{font-size:15px;font-weight:800;letter-spacing:1px;color:#edf6ff;padding:9px 12px;background:rgba(4,16,31,.5);border-radius:8px}#score{position:relative;background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}#score .middle{background:transparent!important;padding:0!important}#score .middle b{font-size:38px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}#score .team{background:transparent}#score .team strong{color:var(--team-score,#fff)}#score .team.away strong{color:#f2f6ff}#score .team.home strong{color:#f2f6ff}</style></head><body><main id="stage"><header><div id="finalCount" aria-label="Number of completed games">0 GAMES</div><img src="../landscape-preview-v1/assets/branding/man-cave-sports-book-transparent.png" alt="Man Cave Sports Book"><div class="title">GAME CENTER</div><div id="league"><img id="leagueLogo" alt="League logo"><span id="leagueText">LOADING</span></div></header><section class="glass" id="score"><div class="team away"><img id="awayLogo" alt=""><span id="awayName">AWAY</span><strong id="awayScore">—</strong></div><div class="middle"><b id="status">FINAL</b><small id="date">Verified results only</small></div><div class="team home"><strong id="homeScore">—</strong><span id="homeName">HOME</span><img id="homeLogo" alt=""></div></section><div id="body"><section class="glass panel performer"><h2>AWAY TOP PERFORMER</h2><img id="awayPlayerImg" hidden alt=""><h3 id="awayPlayer">Awaiting game data</h3><p id="awayPlayerStats">—</p></section><section class="glass panel"><h2>TEAM COMPARISON</h2><div class="logos"><div><img id="awayCenterLogo" alt=""><b id="awayAbbr"></b></div><div><img id="homeCenterLogo" alt=""><b id="homeAbbr"></b></div></div><div id="stats"><div class="notice">Loading verified team statistics…</div></div></section><section class="glass panel performer"><h2>HOME TOP PERFORMER</h2><img id="homePlayerImg" hidden alt=""><h3 id="homePlayer">Awaiting game data</h3><p id="homePlayerStats">—</p></section></div><footer class="glass" id="ticker"><span id="ticker-label">LAST 24H</span><div id="ticker-track"><div id="ticker-content">Loading completed games…</div></div></footer></main><script>
const leagues={NBA:['basketball','nba'],WNBA:['basketball','wnba'],NFL:['football','nfl'],CFB:['football','college-football'],NHL:['hockey','nhl'],MLB:['baseball','mlb'],CBB:['basketball','mens-college-basketball']};const params=new URLSearchParams(location.search);const sport=(params.get('sport')||'NBA').toUpperCase();const cfg=leagues[sport]||leagues.NBA;document.getElementById('leagueText').textContent=sport;document.getElementById('leagueLogo').src='../landscape-preview-v1/assets/league-logos/'+sport+'.png';document.getElementById('leagueLogo').onerror=function(){this.hidden=true};function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720))}addEventListener('resize',fit);fit();const el=id=>document.getElementById(id);const api='https://site.api.espn.com/apis/site/v2/sports/'+cfg.join('/');async function json(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function team(event,side){return event.competitions?.[0]?.competitors?.find(c=>c.homeAway===side)}function setImg(id,src){const x=el(id);if(src){x.src=src;x.hidden=false}else{x.hidden=true}}function showGame(event){const venueTeam=team(event,'home');const venueCode=(venueTeam?.team?.abbreviation||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(venueCode){const image=new Image();const path='../landscape-preview-v1/assets/venues/'+sport+'/'+venueCode+'.webp';image.onload=()=>el('stage').style.setProperty('--venue-image','url("'+path+'")');image.onerror=()=>el('stage').style.removeProperty('--venue-image');image.src=path;}const a=team(event,'away'),h=team(event,'home');if(!a||!h)return;for(const [key,t] of [['away',a],['home',h]]){el(key+'Name').textContent=t.team?.shortDisplayName||t.team?.displayName||key;el(key+'Score').textContent=t.score??'—';el(key+'Abbr').textContent=t.team?.abbreviation||key;const logo=t.team?.logo||t.team?.logos?.[0]?.href;setImg(key+'Logo',logo);setImg(key+'CenterLogo',logo)}el('status').textContent='FINAL';el('date').textContent=new Date(event.date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});loadSummary(event.id)}function renderStats(a,h){const sa=a?.statistics||[],sh=h?.statistics||[];const map=new Map(sh.map(x=>[x.name||x.label,x]));const rows=sa.filter(x=>map.has(x.name||x.label)).slice(0,4);el('stats').innerHTML='';if(!rows.length){el('stats').textContent='Team comparison unavailable for this game';return}for(const x of rows){const y=map.get(x.name||x.label),row=document.createElement('div');row.className='statrow';for(const v of [x.displayValue??x.value??'—',x.label||x.name,y.displayValue??y.value??'—']){const n=document.createElement(v===x.label||v===x.name?'span':'strong');n.textContent=String(v);row.appendChild(n)}el('stats').appendChild(row)}}function showPerformer(side,summary){const teams=summary.boxscore?.players||[];const entry=teams.find(x=>x.team?.id===team(summary.header||{},side)?.team?.id);const competitor=summary.header?.competitions?.[0]?.competitors?.find(x=>x.homeAway===side);const box=teams.find(x=>x.team?.id===competitor?.team?.id);const players=(box?.statistics||[]).flatMap(x=>x.athletes||[]).filter(x=>x.athlete);const p=players.find(x=>x.starter)||players[0];el(side+'Player').textContent=p?.athlete?.displayName||'Player data unavailable';el(side+'PlayerStats').textContent=p?.stats?.slice(0,3).join(' • ')||'—';setImg(side+'PlayerImg',p?.athlete?.headshot?.href)}async function loadSummary(id){el('stats').textContent='Loading team comparison…';for(const side of ['away','home']){el(side+'Player').textContent='Loading performer…';el(side+'PlayerStats').textContent='—';setImg(side+'PlayerImg',null)}try{const s=await json(api+'/summary?event='+encodeURIComponent(id));const c=s.boxscore?.teams||[];renderStats(c.find(x=>x.homeAway==='away'),c.find(x=>x.homeAway==='home'));showPerformer('away',s);showPerformer('home',s)}catch(e){el('stats').textContent='Verified statistics unavailable';for(const side of ['away','home'])el(side+'Player').textContent='Player data unavailable'}}async function update(){try{const now=Date.now(),days=[0,1,2,3,4,5,6,7].map(d=>{const date=new Date(now-d*86400000);return date.getFullYear()+String(date.getMonth()+1).padStart(2,'0')+String(date.getDate()).padStart(2,'0')});const results=await Promise.all(days.map(d=>json(api+'/scoreboard?dates='+d+'&limit=200').catch(()=>({events:[]}))));const seen=new Map();results.flatMap(x=>x.events||[]).filter(e=>e.status?.type?.state==='post').forEach(e=>seen.set(e.id,e));const all=[...seen.values()].sort((a,b)=>new Date(b.date)-new Date(a.date));const recent=all.filter(e=>now-new Date(e.date).getTime()<=86400000);const chosen=recent.length?recent:all;if(!chosen.length){el('finalCount').textContent='0 GAMES';el('ticker-content').textContent='No completed '+sport+' games available';el('stats').textContent='No completed games available';return}el('ticker-label').textContent=recent.length?'LAST 24H':'RECENT GAMES';el('finalCount').textContent=chosen.length+' '+(chosen.length===1?'GAME':'GAMES')+(recent.length?' · 24H':' · RECENT');const track=el('ticker-content');track.replaceChildren();function buildFinal(e){const a=team(e,'away'),h=team(e,'home');const item=document.createElement('span');item.className='ticker-final-item';function addTeam(t){const wrap=document.createElement('span');wrap.className='ticker-final-team';const logo=t?.team?.logo||t?.team?.logos?.[0]?.href;if(logo){const img=document.createElement('img');img.src=logo;img.alt=(t?.team?.abbreviation||'Team')+' logo';img.loading='eager';wrap.appendChild(img)}const name=document.createElement('b');name.textContent=t?.team?.abbreviation||'—';wrap.appendChild(name);const score=document.createElement('strong');score.textContent=t?.score??'—';wrap.appendChild(score);item.appendChild(wrap)}addTeam(a);const dash=document.createElement('span');dash.textContent='–';dash.className='ticker-final-dash';item.appendChild(dash);addTeam(h);const status=document.createElement('small');status.textContent=recent.length?'':new Date(e.date).toLocaleDateString();item.appendChild(status);return item}for(let repeat=0;repeat<2;repeat++){for(const e of chosen)track.appendChild(buildFinal(e))}track.animate([{transform:'translateX(0)'},{transform:'translateX(-50%)'}],{duration:Math.max(25000,chosen.length*5000),iterations:Infinity});const wanted=params.get('event');showGame(chosen.find(e=>e.id===wanted)||chosen[0])}catch(e){el('ticker-content').textContent='Unable to load verified '+sport+' finals';el('stats').textContent='Game data temporarily unavailable'}}update();setInterval(update,120000);
</script></body></html>
