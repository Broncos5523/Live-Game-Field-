    <script>
      window.addEventListener('error', function (event) {
        window.setTimeout(function () {
          var mount = document.getElementById('app');
          if (mount && !document.querySelector('.dashboard')) {
            mount.innerHTML = '<div class="boot-screen boot-error"><strong>DASHBOARD STARTUP ERROR</strong><span>' +
              String(event.message || 'The display script could not start.') +
              '</span><small>Refresh this preview. The browser console includes the error details.</small></div>';
          }
        }, 100);
      });
    </script>
  <link rel="stylesheet" href="landscape.css?v=2" />

    <style>
      /* V11 review: never render structured play-cue JSON as visible court text. */

    </style>
  <link rel="stylesheet" href="../static-all-sports/static.css?v=3"><style>
/* Restore approved continuous score ticker only; all playing surfaces remain static. */
.ticker .ticker-fade-content > div { animation: mancave-live-ticker 35s linear infinite !important; will-change: transform; }
@keyframes mancave-live-ticker { from { transform:translateX(0); } to { transform:translateX(-50%); } }
/* A recorded final has no current drive or next down to advertise. */
.dashboard[data-state="post"] .game-story.is-live:has(.football-field) .football-drive-banner,
.dashboard[data-state="post"] .game-story.is-live:has(.football-field) .football-down-distance{display:none!important}
</style><link rel="stylesheet" href="../rotation-preview/rank.css"><style>.ticker .ticker-fade-content{justify-content:flex-start!important;scroll-behavior:auto!important}.ticker .ticker-fade-content>div{animation:none!important;transform:none!important;flex-shrink:0!important}</style><style>
/* Fixed ESPN network mark on every live-game ticker, independent of scrolling scores. */
.ticker .ticker-brand{width:92px!important;min-width:92px!important;flex:0 0 92px!important;height:35px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:url('../landscape-preview-v1/assets/network_logos/ESPN.png') center/contain no-repeat!important}
.ticker .ticker-brand span{visibility:hidden!important}
</style></head>
