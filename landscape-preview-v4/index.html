<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../landscape-preview-v1/" />
    <title>Man Cave Live Game Center | Landscape V4 Motion Review</title>
    <link rel="stylesheet" href="styles.css?v=20261004-v5" />
    <script>
      window.addEventListener('error', function (event) {
        window.setTimeout(function () {
          var mount = document.getElementById('app');
          if (mount && !document.querySelector('.dashboard')) {
            mount.innerHTML = '<div class="boot-screen boot-error"><strong>DASHBOARD STARTUP ERROR</strong><span>' +
              String(event.message || 'The display script could not start.') +
              '</span><small>Close this page, restart the BAT file, and reopen the displayed address.</small></div>';
          }
        }, 100);
      });
    </script>
  <link rel="stylesheet" href="landscape.css?v=2" />
  <link rel="stylesheet" href="../landscape-preview-v2/review.css" />
    <link rel="stylesheet" href="../landscape-preview-v4/surfaces.css?v=3" />
  </head>
  <body>
    <div id="app">
      <div class="boot-screen"><strong>MAN CAVE LIVE GAME CENTER</strong><span>STARTING DISPLAY…</span></div>
    </div>
    <script src="landscape.js?v=2"></script>
    <script src="../landscape-preview-v4/app.js?v=3"></script>
    <script src="../landscape-preview-v4/motion.js?v=3"></script>
  </body>
