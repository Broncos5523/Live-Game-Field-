<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../landscape-preview-v1/" />
    <title>Man Cave Live Game Center — selected league review</title>
    <link rel="stylesheet" href="styles.css?v=20261004-v5" />
    <script>
      window.addEventListener('error', function (event) {
        window.setTimeout(function () {
          var mount = document.getElementById('app');
          if (mount && !document.querySelector('.dashboard')) {
            mount.innerHTML = '<div class="boot-screen boot-error"><strong>DASHBOARD STARTUP ERROR</strong><span>' +
              String(event.message || 'The display script could not start.') +
              '</span><small>Refresh this preview. The browser console includes the error details.</small></div>';
          }
        }, 100);
      });
    </script>
  <link rel="stylesheet" href="landscape.css?v=2" />
  <link rel="stylesheet" href="../landscape-preview-v2/review.css" />
    <link rel="stylesheet" href="../static-all-sports/shared-surfaces.css?v=1" />
    <link rel="stylesheet" href="../landscape-preview-v6/glass.css" />
    <link rel="stylesheet" href="../landscape-preview-v7/brand.css" />
    <link rel="stylesheet" href="../landscape-preview-v8/header.css?v=2" />
    <link rel="stylesheet" href="../landscape-preview-v9/sideline.css?v=2" />
    <link rel="stylesheet" href="../landscape-preview-v11/play-motion.css?v=20261108-jsonfix2" />
    <link rel="stylesheet" href="../landscape-preview-v12/football-review.css?v=20261108-goalpost17" />
    <style>
      /* V11 review: never render structured play-cue JSON as visible court text. */
      .game-story .basketball-status .basketball-court[data-play-cue]::before { content: none !important; display: none !important; }
    </style>
  <link rel="stylesheet" href="../static-all-sports/static.css?v=3"><style>
/* A recorded final has no current drive or next down to advertise. */
.dashboard[data-state="post"] .game-story.is-live:has(.football-field) .football-drive-banner,
.dashboard[data-state="post"] .game-story.is-live:has(.football-field) .football-down-distance{display:none!important}
</style></head>
  <body>
    <div id="app">
      <div class="boot-screen"><strong>MAN CAVE LIVE GAME CENTER</strong><span>STARTING DISPLAY…</span></div>
    </div>
    <script src="landscape.js?v=2"></script>
    <script src="../landscape-preview-v10/play-feed.js"></script>
    <script src="../static-all-sports/review-app.js?v=1"></script>

    <script src="../sportscore-nba-test/football-branding-react-safe.js?v=startup-repair-1"></script>
  </body>
</html>
