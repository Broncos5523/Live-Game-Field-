 solid #bb9d59;background:#112236}.team{display:flex;align-items:center;justify-content:space-evenly;font-weight:900;font-size:clamp(13px,2.3vw,32px)}.den{background:linear-gradient(90deg,#c54e16,#132a3f)}.kc{background:linear-gradient(90deg,#98152d,#17243a)}.team strong{font-size:1.7em}.status{display:grid;place-content:center;text-align:center;font-weight:900;font-size:clamp(10px,1.4vw,20px)}.status small{color:#edc46d}.spot{border-left:2px solid #ad9154;padding:7px 10px;display:flex;align-items:center;gap:9px;min-width:0}.spot .photo{height:85%;aspect-ratio:1;max-width:82px;border:2px solid #d2b36b;background:#26425d;object-fit:contain}.spot b{display:block;font-size:clamp(11px,1.5vw,21px)}.spot small{font-size:clamp(9px,.95vw,14px);color:#edc46d}.spot p{margin:3px 0;font-size:clamp(9px,1.1vw,16px)}.dot{transition:opacity .2s}.dot circle{stroke:#fff;stroke-width:.65}.dot text{fill:white;font-weight:900;font-size:2.1px;text-anchor:middle;dominant-baseline:central}.ball{fill:#f8cf7a;stroke:#1a1a1a;stroke-width:.5}.route{stroke:#ffe27b;stroke-width:1.3;stroke-dasharray:2 2;fill:none;opacity:0}.route.on{opacity:1;stroke-dasharray:180;stroke-dashoffset:180;animation:draw 1.7s linear forwards}@keyframes draw{to{stroke-dashoffset:0}}@media(max-width:650px){.playpanel{width:82%;top:9%;gap:5px;padding:6px}.result{max-width:110px}.flag{font-size:9px}.controls button{padding:7px}.spot{padding:4px}.spot .photo{max-width:50px}}
</style></head><body><main><header><span>MAN CAVE SPORTS BOOK <em>/ V4 DOT-PLAYER LAB</em></span><span>DEMO • NOT LIVE</span></header><section class="fieldbox"><svg id="field" viewBox="0 0 120 53.3" preserveAspectRatio="xMidYMid meet" aria-label="Football field with animated player dots"><defs><pattern id="grass" width="10" height="53.3" patternUnits="userSpaceOnUse"><rect width="10" height="53.3" fill="#287a46"/><rect width="5" height="53.3" fill="#2b814b"/></pattern></defs><rect width="120" height="53.3" fill="url(#grass)"/><rect width="10" height="53.3" fill="#df5d17"/><rect x="110" width="10" height="53.3" fill="#a71930"/><g stroke="#fff" opacity=".9"><rect x="10" y="1" width="100" height="51.3" fill="none" stroke-width=".45"/></g><g id="marks"></g><text x="5" y="26.6" transform="rotate(-90 5 26.6)" text-anchor="middle" fill="#fff" font-size="5" font-weight="900">BRONCOS</text><text x="115" y="26.6" transform="rotate(90 115 26.6)" text-anchor="middle" fill="#fff" font-size="5" font-weight="900">CHIEFS</text><line id="los" x1="48" x2="48" y1="1" y2="52.3" stroke="#6bd7ff" stroke-width=".6"/><line id="first" x1="58" x2="58" y1="1" y2="52.3" stroke="#ffd13f" stroke-width=".65"/><g id="players"></g><path id="route" class="route" d="M 44 26 L 63 15"/><ellipse id="ball" class="ball" cx="44" cy="26" rx="1.3" ry=".7"/></svg><div class="flag">DENVER vs KANSAS CITY • PLAY TEST V4</div><div class="playpanel" id="panel"></div><div class="controls"><button id="reset">RESET</button><button id="play">▶ TEST PLAY</button></div></section><footer><div class="team den">DEN <strong>24</strong></div><div class="team kc">KC <strong>20</strong></div><div class="status">Q4 02:18<small id="down">1ST &amp; 10</small></div><div class="spot"><img class="photo" id="spotimg" alt="Featured player" src="https://a.espncdn.com/i/headshots/nfl/players/full/4431611.png" onerror="this.style.visibility='hidden'"><div><small>PLAY SPOTLIGHT</small><b id="spotname">BO NIX</b><p id="spotdetail">Press TE const ns="http://www.w3.org/2000/svg",mk=(tag,attrs,parent)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e};const marks=document.getElementById("marks");for(let i=10;i<=110;i+=5){mk("line",{x1:i,x2:i,y1:1,y2:52.3,stroke:"white","stroke-width":i%10===0?".42":".19",opacity:".8"},marks);for(const y of [19,34])mk("line",{x1:i,x2:i,y1:y-1.1,y2:y+1.1,stroke:"white","stroke-width":".3"},marks)}for(let i=20;i<=100;i+=10){const yard=i<=60?i-10:110-i;for(const y of [8,46]){const t=mk("text",{x:i,y,fill:"#fff","font-size":"4.3","font-weight":"900","text-anchor":"middle",opacity:".85"},marks);t.textContent=yard}}const players=document.getElementById("players");const dots=[];for(let i=0;i<22;i++){const den=i<11;const x=den?(i===0?43:47-(i%4)*1.7):(52+(i%3)*2.3);const y=den?(i===0?26:5+(i-1)*4.3):(5+(i-11)*4.3);const g=mk("g",{class:"dot"},players);mk("circle",{r:"1.65",fill:den?"#f16a20":"#bc1735"},g);const label=mk("text",{x:0,y:".2"},g);label.textContent=den?([10,14,33,72,74,77,69,82,88,17,23][i]):([15,95,22,38,55,56,32,20,21,91,98][i-11]);g.setAttribute("transform","translate("+x+" "+y+")");dots.push({g,x,y,den})}const plays=[{type:"PASS COMPLETE",detail:"18-yard completion",names:[["BO NIX","PASSER","4431611"],["COURTLAND SUTTON","RECEIVER","3045144"]],end:[63,15],route:"M43 26 Q52 12 63 15",down:"1ST DOWN • DEN"},{type:"RUSH",detail:"7-yard gain",names:[["JAVONTE WILLIAMS","BALL CARRIER","4361579"]],end:[53,27],route:"M43 26 L53 27",down:"2ND & 3 • DEN"},{type:"INCOMPLETE PASS",detail:"Pass falls incomplete",names:[["BO NIX","PASSER","4431611"],["COURTLAND SUTTON","TARGET","3045144"]],end:[65,15],route:"M43 26 Q55 13 65 15",down:"2ND & 10 • DEN"}];let current=-1,busy=false,timer=null;function headshot(p){const wrap=document.createElement("div");wrap.className="person";const img=document.createElement("img");img.src="https://a.espncdn.com/i/headshots/nfl/players/full/"+p[2]+".png";img.alt=p[0];img.onerror=()=>{const fb=document.createElement("div");fb.className="fallback";fb.textContent=p[0].split(" ").map(s=>s[0]).join("");img.replaceWith(fb)};const b=document.createElement("b");b.textContent=p[0];const s=document.createElement("small");s.textContent=p[1];wrap.append(img,b,s);return wrap}function reset(){clearTimeout(timer);busy=false;document.getElementById("panel").classList.remove("show");document.getElementById("route").classList.remove("on");document.getElementById("ball").setAttribute("cx",43);document.getElementById("ball").setAttribute("cy",26);dots.forEach(d=>d.g.setAttribute("transform","translate("+d.x+" "+d.y+")"));document.getElementById("play").disabled=false}function test(){reset();busy=true;current=(current+1)%plays.length;const p=plays[current],panel=document.getElementById("panel"),route=document.getElementById("route");panel.replaceChildren();p.names.forEach((n,i)=>{if(i){const arrow=document.createElement("div");arrow.textContent="➜";arrow.style.color="#f4c56e";panel.append(arrow)}panel.append(headshot(n))});const info=document.createElement("div");info.className="result";const strong=document.createElement("strong");strong.textContent=p.type;const desc=document.createElement("span");desc.textContent=p.detail;info.append(strong,desc);panel.append(info);panel.classList.add("show");route.setAttribute("d",p.route);route.classList.remove("on");void route.getBoundingClientRect();route.classList.add("on");document.getElementById("spotname").textContent=p.names.map(x=>x[0]).join(" + ");document.getElementById("spotdetail").textContent=p.detail;document.getElementById("spotimg").src="https://a.espncdn.com/i/headshots/nfl/players/full/"+p.names[0][2]+".png";document.getElementById("down").textContent=p.down;const start=performance.now();function frame(now){if(!busy)return;const t=Math.min((now-start)/1900,1);const smooth=t*t*(3-2*t);document.getElementById("ball").setAttribute("cx",43+(p.end[0]-43)*smooth);document.getElementById("ball").setAttribute("cy",26+(p.end[1]-26)*smooth);dots.forEach((d,i)=>{let dx=0,dy=0;if(d.den){dx=i===0?1.5*smooth:(i%3===0?12:3)*smooth;dy=(i%2? -2:2)*smooth}else dx=-(i%3+1)*smooth;d.g.setAttribute("transform","translate("+(d.x+dx)+" "+(d.y+dy)+")")});if(t<1)requestAnimationFrame(frame);else{busy=false;timer=setTimeout(()=>{panel.classList.remove("show")},4500)}}requestAnimationFrame(frame)}document.getElementById("play").onclick=test;document.getElementById("reset").onclick=()=>{reset();current=-1;document.getElementById("down").textContent="1ST & 10";document.getElementById("spotdetail").textContent="Press TEST PLAY to start"};</script></body></html>
