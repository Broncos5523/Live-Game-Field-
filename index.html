*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060c15;color:#fff;font-family:Arial,Helvetica,sans-serif}.app{height:100dvh;display:flex;flex-direction:column;padding:1.1vh 1vw;gap:.8vh;background:radial-gradient(ellipse at 50% 0%,#17263a,#050a12 80%)}.top{height:5%;display:flex;justify-content:space-between;align-items:center;gap:1rem;letter-spacing:.13em;font-weight:900;font-size:clamp(9px,1.15vw,20px)}.gold{color:#e8c46c}.state{font-size:.75em;color:#d4e0f0;letter-spacing:.08em}.arena{flex:1;min-height:0;position:relative;border:2px solid #a48a50;box-shadow:0 0 26px #d1a84930;overflow:hidden;border-radius:8px;background:#0c1822}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:#07111ce8;border:1px solid #d8b862;padding:.55vh 1.5vw;text-align:center;border-radius:4px;min-width:28%;pointer-events:none}.overlay small{display:block;color:#efcb72;font-size:clamp(9px,.8vw,15px);font-weight:800;letter-spacing:.15em}.overlay strong{font-size:clamp(12px,1.4vw,26px)}.alert{position:absolute;top:33%;left:15%;right:15%;padding:1.2vh 1vw;text-align:center;background:#08121ff2;border:3px solid #f3cb62;box-shadow:0 0 45px #d9ac4a90;transform:scale(.96);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}.alert.visible{opacity:1;transform:scale(1)}.alert b{display:block;background:#e9bf58;color:#101522;font-size:clamp(13px,1.4vw,24px);letter-spacing:.15em;padding:.35vh}.alert strong{display:block;font-size:clamp(18px,2.5vw,40px);margin:.8vh}.alert span{font-size:clamp(11px,1.15vw,19px)}.wipe{position:absolute;inset:0;background:linear-gradient(105deg,#07111e,#d3aa4e 46%,#fff0a4 50%,#14243b 54%,#07111e);transform:translateX(-105%);pointer-events:none}.wipe.go{animation:wipe .8s ease-in-out}@keyframes wipe{0%{transform:translateX(-105%)}100%{transform:translateX(105%)}}.strip{height:21%;min-height:75px;display:grid;grid-template-columns:21% 21% 17 </style></head><body><main class="app"><header class="top"><div>MAN CAVE SPORTS BOOK <span class="gold">/ MULTI-SPORT VIRTUAL ARENA</span></div><div class="state" id="mode">SHOWCASE PROTOTYPE • DEMO DATA</div></header><section class="arena" id="arena"><canvas id="scene" aria-label="Illustrative overhead miniature sports arena"></canvas><div class="overlay" id="recap"><small>LAST PLAY</small><strong id="event">Preparing arena...</strong></div><div class="alert" id="alert"><b>BREAKING PLAY</b><strong id="alertText">MAJOR MOMENT</strong><span id="alertMatch">SWITCHING GAMES</span></div><div class="wipe" id="wipe"></div><div class="demo">ILLUSTRATIVE DEMO • NOT LIVE GAME DATA</div><div class="controls"><button id="next">NEXT GAME</button><button id="moment">TEST ALERT</button></div></section><footer class="strip"><div class="team" id="awayBox"><span class="abbr" id="away">DEN</span><span class="score" id="awayScore">24</span></div><div class="team" id="homeBox"><span class="abbr" id="home">KC</span><span class="score" id="homeScore">20</span></div><div class="status"><strong id="clock">Q4 02:18</strong><small id="detail">1ST &amp; 10</small></div><div class="card"><div class="portrait" id="portrait"><span class="fallback" id="initials">BN</span></div><div class="cardcopy"><small id="leaderType">GAME LEADER • QB</small><h2 id="leader">BO NIX</h2><p id="stats">248 PASS YDS • 2 TD</p></div></div></footer></main><script>

];const $=id=>document.getElementById(id),canvas=$("scene"),ctx=canvas.getContext("2d");let idx=0,leaderIdx=0,last=0,animStart=performance.now(),alertUntil=0,alertPending=false;function fit(){const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",fit);fit();function switchGame(n){$("wipe").classList.remove("go");void $("wipe").offsetWidth;$("wipe").classList.add("go");setTimeout(()=>{idx=(n+games.length)%games.length;leaderIdx=0;animStart=performance.now();update()},390)}function update(){const g=games[idx];$("away").textContent=g.away;$("home").textContent=g.home;$("awayScore").textContent=g.a;$("homeScore").textContent=g.h;$("awayBox").style.setProperty("--team",g.colors[0]);$("homeBox").style.setProperty("--team",g.colors[1]);$("clock").textContent=g.clock;$("detail").textContent=g.detail;$("event").textContent=g.event;updateLeader()}function updateLeader(){const g=games[idx],p=g.leaders[leaderIdx%g.leaders.length];$("leaderType").textContent="GAME LEADER • "+p[1];$("leader").textContent=p[0];$("stats").textContent=p[2];$("portrait").style.setProperty("--team",g.colors[leaderIdx%2]);$("initials").textContent=p[0].split(" ").map(s=>s[0]).join("").slice(0,2)}$("next").onclick=()=>switchGame(idx+1);$("moment").onclick=()=>{const next=(idx+1)%games.length;$("alertText").textContent="MAJOR SCORING PLAY";$("alertMatch").textContent=games[next].away+" vs "+games[next].home+" • DEMO";$("alert").classList.add("visible");alertUntil=performance.now()+2200;alertPending=true};setInterval(()=>{leaderIdx++;updateLeader()},7000);setInterval(()=>{if(!alertPending)switchGame(idx+1)},60000);
function line(x,y,X,Y,color="#fff",w=2){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function label(t,x,y,size=15,color="#fff"){ctx.fillStyle=color;ctx.font="900 "+size+"px Arial";ctx.textAlign="center";ctx.fillText(t,x,y)}function athlete(x,y,color,scale=1){ellipse(x+2*scale,y+4*scale,7*scale,3*scale,"#0007");ellipse(x,y,6*scale,7*scale,color);ellipse(x,y-2*scale,3.1*scale,3.1*scale,"#f3d6ac")}
function draw(t){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const g=games[idx];rect(0,0,w,h,"#101923");const m=Math.min(w*.06,h*.11),x=m,y=m*.75,fw=w-2*m,fh=h-1.55*m;
// stadium surroundings: crowd rows, bench zone and surrounding architectural rim
for(let ring=0;ring<5;ring++){ctx.strokeStyle=ring%2?"#26384a":"#34475b";ctx.lineWidth=8;ctx.strokeRect(7+ring*6,7+ring*5,w-14-ring*12,h-14-ring*10)}
const crowdColors=["#aab8c5","#53667b",g.colors[0],g.colors[1],"#b3a06b"];for(let i=0;i<450;i++){const u=(i*0.61803398875)%1,v=(i*.7548776662)%1;let px=u*w,py=v*h;if(px>x-14&&px<x+fw+14&&py>y-14&&py<y+fh+14)continue;ellipse(px,py,1.3,1.3,crowdColors[i%5])}
rect(x-10,y-10,fw+20,fh+20,"#667383");rect(x,y,fw,fh,g.sport==="football"?"#23643b":g.sport==="basketball"?"#c89c64":g.sport==="hockey"?"#e6eff5":"#2c7041");
ctx.save();ctx.beginPath();ctx.rect(x,y,fw,fh);ctx.clip();
if(g.sport==="football"){for(let i=0;i<10;i++)rect(x+i*fw/10,y,fw/10,fh,i%2?"#ffffff08":"#0000000b");rect(x,y,fw*.095,fh,g.colors[0]);rect(x+fw*.905,y,fw*.095,fh,g.colors[1]);for(let i=1;i<10;i++)line(x+i*fw/10,y,x+i*fw/10,y+fh,"#ffffffa0",1.4);label(g.away,x+fw*.048,y+fh*.53,Math.min(20,fw*.035));label(g.home,x+fw*.95,y+fh*.53,Math.min(20,fw*.035))}
if(g.sport==="basketball"){ctx.strokeStyle="#fff9";ctx.lineWidth=2;ctx.strokeRect(x+fw*.04,y+fh*.06,fw*.92,fh*.88);line(x+fw/2,y,x+fw/2,y+fh,"#fff9");ctx.beginPath();ctx.arc(x+fw/2,y+fh/2,fh*.13,0,7);ctx.stroke();for(const s of [0,1]){const bx=x+(s?fw*.82:fw*.04);ctx.strokeRect(bx,y+fh*.25,fw*.14,fh*.5);ctx.beginPath();ctx.arc(x+(s?fw*.91:fw*.09),y+fh/2,fh*.025,0,7);ctx.stroke()}}
if(g.sport==="hockey"){ctx.strokeStyle="#bc2639";ctx.lineWidth=3;ctx.strokeRect(x+4,y+4,fw-8,fh-8);line(x+fw/2,y,x+fw/2,y+fh,"#c52b43",3);for(const p of [.29,.71])line(x+fw*p,y,x+fw*p,y+fh,"#2c6baa",4);ctx.beginPath();ctx.arc(x+fw/2,y+fh/2,fh*.12,0,7);ctx.stroke()}
if(g.sport==="baseball"){rect(x,y,fw,fh,"#347b43");ctx.save();ctx.translate(x+fw*.5,y+fh*.73);ctx.rotate(Math.PI/4);rect(-fh*.19,-fh*.19,fh*.38,fh*.38,"#b98a5e");ctx.restore();line(x+fw*.5,y+fh*.73,x+fw*.13,y+fh*.12,"#fff8");line(x+fw*.5,y+fh*.73,x+fw*.87,y+fh*.12,"#fff8");ellipse(x+fw*.5,y+fh*.48,fh*.035,fh*.035,"#c89b73")}
const sec=(t-animStart)/1000,move=sec<3?Math.sin(sec*2.1)*Math.min(fh*.08,25):0;
if(g.sport==="football"){for(let i=0;i<11;i++){athlete(x+fw*.42+(i%4)*fw*.025+move,y+fh*(.18+(i%6)*.12),g.colors[0],Math.max(.75,fh/290));athlete(x+fw*.56+(i%4)*fw*.025-move*.35,y+fh*(.18+(i%6)*.12),g.colors[1],Math.max(.75,fh/290))}}
else if(g.sport==="basketball"){for(let i=0;i<5;i++){athlete(x+fw*(.32+(i%3)*.08)+move,y+fh*(.28+(i%3)*.2),g.colors[0],Math.max(.75,fh/290));athlete(x+fw*(.55+(i%3)*.08)-move*.3,y+fh*(.25+(i%3)*.22),g.colors[1],Math.max(.75,fh/290))}}
else if(g.sport==="hockey"){for(let i=0;i<6;i++){athlete(x+fw*(.24+(i%3)*.12)+move,y+fh*(.2+(i%3)*.25),g.colors[0],Math.max(.75,fh/290));athlete(x+fw*(.59+(i%3)*.12)-move*.4,y+fh*(.2+(i%3)*.25),g.colors[1],Math.max(.75,fh/290))}}
else{for(let i=0;i<9;i++)athlete(x+fw*(.25+(i%3)*.25),y+fh*(.25+Math.floor(i/3)*.2),g.colors[1],Math.max(.75,fh/290));athlete(x+fw*.5+move,y+fh*.72,g.colors[0],1)}
ctx.restore();rect(x,y+fh+5,fw,Math.max(5,m*.12),"#3d4d60");label("ILLUSTRATIVE EVENT RECREATION",w/2,h-12,Math.max(9,Math.min(13,w*.012)),"#a9b8c9");
