<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Man Cave Sports Book — SportScore isolated integration</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020811}#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}#board{width:100%;height:100%;border:0}#sportscore-layer{position:absolute;display:none;z-index:10;overflow:hidden;background:#07131d}#sportscore-layer [data-sportscore]{width:100%;height:100%}#status{position:absolute;bottom:4px;left:6px;background:#06111bc9;color:#a5c0cf;font:11px Arial;padding:3px 6px;z-index:20;pointer-events:none}</style></head><body><div id="stage"><iframe id="board" title="Existing Man Cave Sports Book layout" src="./man-cave-dashboard-safe.html?nba-sportscore-preview=1"></iframe><div id="sportscore-layer"><div data-sportscore="tracker" data-sport="basketball" data-competition="national-basketball-association">Loading SportScore…</div></div><div id="status">Existing board isolated; waiting for NBA court</div></div><script>function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720))}addEventListener('resize',fit);fit();var board=document.getElementById('board'),layer=document.getElementById('sportscore-layer'),status=document.getElementById('status');function sync(){try{var d=board.contentDocument;if(!d)return;var court=d.querySelector('.basketball-court');if(!court){layer.style.display='none';status.textContent='Existing board active — no NBA court in current game';return}var r=court.getBoundingClientRect();if(r.width<10||r.height<10){layer.style.display='none';return}layer.style.cssText='display:block;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';status.textContent='SportScore tracker overlay active (full widget; court-only mode unverified)'}catch(e){layer.style.display='none';status.textContent='Board access unavailable: '+e.message}}setInterval(sync,750);board.addEventListener('load',sync);</script><script src="https://sportscore.com/embed.js" async></script></body></html>
